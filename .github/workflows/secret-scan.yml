name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install checksum-verified Gitleaks 8.30.1
        shell: bash
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/gitleaks.tar.gz" --directory "$RUNNER_TEMP" gitleaks
      - name: Scan all history with default rules and redacted output
        shell: bash
        run: |
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks-default.toml"
          "$RUNNER_TEMP/gitleaks" git . \
            --config "$RUNNER_TEMP/gitleaks-default.toml" \
            --log-opts="--all --full-history" \
            --ignore-gitleaks-allow --redact=100 --no-banner \
            --max-decode-depth=10 --max-archive-depth=3 --timeout=120
